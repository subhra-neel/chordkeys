<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151b">
<title>ChordKeys</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef1f4;--fg:#14202b;--mut:#66727e;--card:#fff;--line:#c3ccd5;--rh:#e59a0b;--lh:#0b8a8f;--ok:#2f9e5b;--kw:#fff;--kb:#1b2430;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--fg:#e8edf2;--mut:#8b97a3;--card:#18202a;--line:#3a4654;--rh:#f2b23a;--lh:#3cc3c8;--ok:#4cc27c;--kw:#d9dee3;--kb:#0a0e13}}
:root[data-theme="dark"]{--bg:#10151b;--fg:#e8edf2;--mut:#8b97a3;--card:#18202a;--line:#3a4654;--rh:#f2b23a;--lh:#3cc3c8;--ok:#4cc27c;--kw:#d9dee3;--kb:#0a0e13}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:980px;margin:0 auto}
h1{font:700 20px/1.2 Georgia,"Times New Roman",serif;margin:4px 0 2px}
#st{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button,.btn{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:focus-visible,.btn:focus-within,select:focus-visible{outline:2px solid var(--lh);outline-offset:2px}
.on{background:var(--lh);color:#fff;border-color:var(--lh)}
select{font:inherit;font-size:14px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
canvas{display:block;background:var(--card);border-radius:12px;margin-bottom:8px}
#kb{touch-action:none}
#info{font-size:14px;margin:6px 0;min-height:42px;color:var(--fg)}
#info b{font-size:17px}
#upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--fg);color:var(--bg)}
#upd[hidden]{display:none}
#upd button{background:var(--lh);color:#fff;border-color:var(--lh)}
#upd #uplater{background:transparent;color:var(--bg);border-color:var(--mut)}
</style></head><body><main>
<h1>ChordKeys <small id="vh" style="font:12px system-ui;color:var(--mut)"></small></h1><div id="st">Tap the keys, or connect a MIDI keyboard.</div>
<div class="bar">
<label class="btn">Open MIDI file<input id="f" type="file" accept=".mid,.midi" hidden></label>
<button id="demo">Load demo</button><button id="pp">Play</button><button id="rw">Restart</button>
</div>
<canvas id="sc"></canvas><canvas id="kb"></canvas>
<div id="info">Open a MIDI file to see chords and fingering.</div>
<div class="bar">
<button id="wait">Wait for me: off</button>
<select id="spd" aria-label="Speed"><option value=".5">50% speed</option><option value=".75">75% speed</option><option value="1" selected>100% speed</option></select>
<button id="vw" class="on">Chord view</button>
<button id="la">Set loop start</button><button id="lb">Set loop end</button><button id="lp">Loop: off</button><button id="sw">Swap hands</button>
</div>
</main>
<p id="vf" style="color:var(--mut);font-size:13px;margin:4px 0 12px"><span id="vt">Version …</span> <button id="chk">Check for updates</button> <span id="upmsg"></span></p>
<div id="upd" hidden role="status"><span id="upt">A new version is ready.</span><span style="display:flex;gap:8px"><button id="uplater">Later</button><button id="upgo">Update now</button></span></div>
<script>
const $=id=>document.getElementById(id);
const NN=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],LN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const nm=n=>LN[n%12]+(Math.floor(n/12)-1),BLK=[1,3,6,8,10];
const T=[['',[0,4,7]],['m',[0,3,7]],['7',[0,4,7,10]],['maj7',[0,4,7,11]],['m7',[0,3,7,10]],['dim',[0,3,6]],['aug',[0,4,8]],['sus4',[0,5,7]],['sus2',[0,2,7]],['6',[0,4,7,9]],['m6',[0,3,7,9]],['dim7',[0,3,6,9]],['m7♭5',[0,3,6,10]],['add9',[0,2,4,7]],['5',[0,7]]];

/* ---------- MIDI file parser ---------- */
function parseMidi(buf){
 const d=new DataView(buf);let p=0;const u32=()=>{const v=d.getUint32(p);p+=4;return v},u16=()=>{const v=d.getUint16(p);p+=2;return v};
 const vl=()=>{let v=0,b;do{b=d.getUint8(p++);v=v<<7|b&127}while(b&128);return v};
 if(u32()!==0x4d546864)throw 0;u32();u16();const nt=u16(),div=u16();
 const ev=[],tm=[[0,500000]];
 for(let t=0;t<nt;t++){
  if(u32()!==0x4d54726b)break;const len=u32(),end=p+len;let tick=0,run=0;
  while(p<end){tick+=vl();let s=d.getUint8(p);
   if(s===255){p++;const ty=d.getUint8(p++),l=vl();if(ty===81)tm.push([tick,d.getUint8(p)<<16|d.getUint8(p+1)<<8|d.getUint8(p+2)]);p+=l}
   else if(s===240||s===247){p++;p+=vl()}
   else{if(s&128){run=s;p++}else s=run;const hi=s>>4,a=d.getUint8(p++),b=(hi===12||hi===13)?0:d.getUint8(p++);
    if((s&15)!==9){if(hi===9&&b>0)ev.push({tick,tr:t,n:a,on:1,k:t+'-'+(s&15)+'-'+a});else if(hi===8||hi===9)ev.push({tick,tr:t,n:a,on:0,k:t+'-'+(s&15)+'-'+a})}}}
  p=end}
 tm.sort((a,b)=>a[0]-b[0]);const seg=[];let sec=0,pt=0,pm=500000;
 for(const[tk,m]of tm){sec+=(tk-pt)*pm/1e6/div;pt=tk;pm=m;seg.push([tk,sec,m])}
 const t2s=k=>{let s=seg[0];for(const x of seg)if(x[0]<=k)s=x;else break;return s[1]+(k-s[0])*s[2]/1e6/div};
 ev.sort((a,b)=>a.tick-b.tick||a.on-b.on);const open={},notes=[];
 for(const e of ev){if(e.on)(open[e.k]=open[e.k]||[]).push(e.tick);else if(open[e.k]&&open[e.k].length)notes.push({n:e.n,tr:e.tr,s:t2s(open[e.k].shift()),e:t2s(e.tick)})}
 return notes}

/* ---------- chord naming ---------- */
function chordName(p){
 const pcs=[...new Set(p.map(x=>x%12))];if(pcs.length<2)return null;
 const bass=Math.min(...p)%12;let best=null,bs=-1;
 for(let r=0;r<12;r++)for(const[q,iv]of T){const set=iv.map(i=>(i+r)%12);
  if(set.length!==pcs.length||!set.every(x=>pcs.includes(x)))continue;
  const sc=iv.length+(r===bass?2:0);if(sc>bs){bs=sc;best=[r,q]}}
 return best?NN[best[0]]+best[1]+(bass!==best[0]?'/'+NN[bass]:''):null}

/* ---------- chords, columns, fingering ---------- */
function handMap(notes){const m={};for(const n of notes)(m[n.tr]=m[n.tr]||[]).push(n.n);
 const ks=Object.keys(m);if(ks.length<2)return null;
 const av=ks.map(k=>[k,m[k].reduce((a,b)=>a+b,0)/m[k].length]).sort((a,b)=>a[1]-b[1]),o={};
 av.forEach(([k],i)=>o[k]=i>=av.length/2?1:0);return o}
function build(notes){
 notes.sort((a,b)=>a.s-b.s||a.n-b.n);const gs=[],hm=handMap(notes),hd=n=>(hm?hm[n.tr]:(n.n>=60?1:0))^(swap?1:0);
 for(const h of [0,1]){let c=null;
  for(const n of notes.filter(n=>hd(n)==h)){if(c&&n.s-c.t<=.06)c.ns.push(n);else{c={t:n.s,ns:[n],h};gs.push(c)}}}
 gs.sort((a,b)=>a.t-b.t||a.h-b.h);
 for(const h of [0,1]){let lp=null,lf=null;
  for(const g of gs.filter(g=>g.h==h)){g.ns.sort((a,b)=>a.n-b.n);const n=g.ns.length,sp=g.ns[n-1].n-g.ns[0].n;
   if(n==1){const p=g.ns[0].n;let f;
    if(lp==null)f=3;else{const d=p-lp;
     if(d==0)f=lf;
     else if(Math.abs(d)<=2){f=lf+((d>0)==!!h?1:-1);if(f<1||f>5)f=(d>0)==!!h?1:5}
     else f=d>0?1:5}
    g.ns[0].f=f;lp=p;lf=f}
   else{let f=n==2?(sp<=4?[1,3]:sp<=7?[1,4]:[1,5]):n==3?[1,3,5]:n==4?[1,2,3,5]:[1,2,3,4,5];
    if(!h)f=f.slice().reverse();g.ns.forEach((x,i)=>x.f=f[i]);lp=null}
   g.ns.forEach(x=>x.h=h)}}
 const cs=[];
 for(const g of gs){let c=cs[cs.length-1];if(c&&g.t-c.t<=.06)c.gs.push(g);else{c={t:g.t,gs:[g]};cs.push(c)}}
 for(const c of cs){const all=c.gs.flatMap(g=>g.ns);c.p=all.map(n=>n.n);c.name=(all.length==2&&c.gs.length>1)?null:chordName(c.p);c.end=Math.max(...all.map(n=>n.e))}

 cs.forEach((c,i)=>c.gs.forEach(g=>g.ci=i));cs.arps=[];
 for(const h of [0,1]){const hg=gs.filter(g=>g.h==h);let i=0;
  while(i<hg.length){let end=-1,q=null,set=null;
   for(let j=i+2;j<Math.min(i+8,hg.length);j++){const w=hg.slice(i,j+1);
    if(w.some(g=>g.ns.length>1)||w[w.length-1].t-w[0].t>1.5)break;
    const ps=w.map(g=>g.ns[0].n),pc=new Set(ps.map(x=>x%12)),nmq=pc.size>=3?chordName(ps):null;
    if(nmq){q=nmq;set=pc;end=j;break}}
   if(end<0){i++;continue}
   while(end+1<hg.length&&end+1<i+8&&hg[end+1].ns.length==1&&hg[end+1].t-hg[i].t<=1.5&&set.has(hg[end+1].ns[0].n%12))end++;
   cs.arps.push({h,a:hg[i].ci,b:hg[end].ci,name:q});i=end+1}}
 return cs}

/* ---------- state ---------- */
let raw=[],swap=false,cols=[],pos=0,playing=false,wait=false,chordView=true,spd=1,A=-1,B=-1,loopOn=false,nxt=0,wi=0,cur=0,lastCur=-1,lo=48,hi=83;
const held=new Set(),ptr={};let ac;
function snd(n,dur){ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();
 const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime,d=Math.min(Math.max(dur,.2),2.5);
 o.type='triangle';o.frequency.value=440*2**((n-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function setSong(notes){
 if(!notes.length){$('st').textContent='No playable notes found in that file.';return}
 raw=notes;cols=build(notes);const ps=cols.flatMap(c=>c.p);lo=Math.floor(Math.min(...ps)/12)*12;hi=Math.ceil((Math.max(...ps)+1)/12)*12-1;
 A=B=-1;stop();seek(0);lastCur=-1;
 $('st').textContent=cols.length+' positions, '+cols.filter(c=>c.name).length+' chords and '+cols.arps.length+' arpeggios detected. Hands split by '+(handMap(notes)?'track':'pitch (middle C)')+'. Tap the staff to jump.'}
function seek(i){i=Math.max(0,Math.min(cols.length-1,i));pos=cols[i].t-(playing?.8:0);nxt=i;wi=i}
function stop(){playing=false;$('pp').textContent='Play'}
function demo(){
 const ch=[[48,[60,64,67]],[43,[59,62,67]],[45,[60,64,69]],[41,[60,65,69]],[50,[60,62,65,69]],[43,[59,62,65,67]],[48,[59,64,67,71]],[48,[60,64,67]]],ns=[];
 ch.forEach(([b,r],i)=>{const s=i*1.2;ns.push({n:b,s,e:s+1.1});r.forEach(n=>ns.push({n,s,e:s+1.1}))});
 ns.push({n:72,s:8.4,e:9.2},{n:76,s:9.6,e:10.2},{n:79,s:10.2,e:10.8},{n:76,s:10.8,e:11.4});
 setSong(ns)}

/* ---------- drawing ---------- */
const sc=$('sc'),kb=$('kb'),sx=sc.getContext('2d'),kx=kb.getContext('2d');let W=0,KW=0,kr=[];const SP=64,TB=100,BB=190,H=4.5;
function fit(c,h){const r=devicePixelRatio||1,w=c.parentElement.getBoundingClientRect().width;c.style.width=w+'px';c.style.height=h+'px';c.width=w*r;c.height=h*r;c.getContext('2d').setTransform(r,0,0,r,0,0);return w}
function resize(){W=fit(sc,230);KW=fit(kb,110)}
const stp=n=>(Math.floor(n/12)-1)*7+[0,0,1,1,2,3,3,4,4,5,5,6][n%12];
function fx(){if(!cols.length)return 0;let i=0;while(i+1<cols.length&&cols[i+1].t<=pos)i++;
 if(pos<cols[0].t)return 0;const n=cols[i+1];return n?i+(pos-cols[i].t)/(n.t-cols[i].t):i}
function draw(){
 const css=getComputedStyle(document.documentElement),C=k=>css.getPropertyValue(k).trim();
 const fg=C('--fg'),mut=C('--mut'),line=C('--line'),lh=C('--lh'),rh=C('--rh'),ok=C('--ok');
 const f=fx();cur=cols.length?((wait&&playing)?Math.min(wi,cols.length-1):Math.min(cols.length-1,Math.floor(f+.02))):0;
 sx.clearRect(0,0,W,230);sx.strokeStyle=line;sx.lineWidth=1;
 for(const b of[TB,BB])for(let i=0;i<5;i++){const y=b-i*9;sx.beginPath();sx.moveTo(0,y);sx.lineTo(W,y);sx.stroke()}
 sx.fillStyle=mut;sx.font='11px system-ui';sx.fillText('Right hand',6,TB-48);sx.fillText('Left hand',6,BB-48);
 const ax=W*.3,ly=(s,b,bs)=>b-(s-bs)*H;
 cols.forEach((c,i)=>{const x=ax+(i-f)*SP;if(x<-40||x>W+40)return;
  if(i===cur){sx.fillStyle=rh;sx.globalAlpha=.13;sx.fillRect(x-26,12,52,210);sx.globalAlpha=1}
  if(A===i||B===i){sx.fillStyle=lh;sx.fillRect(x-1,12,2,8)}
  if(chordView&&c.name){sx.fillStyle=fg;sx.font='700 15px Georgia,serif';sx.textAlign='center';sx.fillText(c.name,x,36);sx.textAlign='left'}
  for(const g of c.gs){let ps=-9,psh=0;
   for(const n of g.ns){const tr=n.n>=60,b=tr?TB:BB,bs=tr?30:18,s=stp(n.n),y=ly(s,b,bs);
    sx.strokeStyle=line;
    if(s<bs)for(let k=bs-2;k>=s-1;k-=2){const yy=ly(k,b,bs);sx.beginPath();sx.moveTo(x-10,yy);sx.lineTo(x+10,yy);sx.stroke()}
    if(s>bs+8)for(let k=bs+10;k<=s+1;k+=2){const yy=ly(k,b,bs);sx.beginPath();sx.moveTo(x-10,yy);sx.lineTo(x+10,yy);sx.stroke()}
    const sh=(s-ps==1&&!psh)?1:0,off=sh?11:0;ps=s;psh=sh;
    const on=held.has(n.n)&&i===cur;sx.fillStyle=on?ok:fg;
    sx.beginPath();sx.ellipse(x+off,y,5.6,4.2,-.3,0,7);sx.fill();
    if(BLK.includes(n.n%12)){sx.font='13px system-ui';sx.fillText('♯',x-17,y+4)}
    if(n.f){sx.fillStyle=n.h?rh:lh;sx.font='700 11px system-ui';sx.fillText(n.f,x+off+9,y+4)}}}});
 for(const a of cols.arps||[]){const x0=ax+(a.a-f)*SP,x1=ax+(a.b-f)*SP;if(x1<-40||x0>W+40)continue;
  sx.strokeStyle=a.h?rh:lh;sx.lineWidth=2;sx.beginPath();sx.moveTo(x0-6,a.h?50:206);sx.lineTo(x1+6,a.h?50:206);sx.stroke();sx.lineWidth=1;
  if(chordView){sx.fillStyle=a.h?rh:lh;sx.font='italic 700 12px Georgia,serif';sx.fillText(a.name+' arp.',x0-6,a.h?46:218)}}
 sx.strokeStyle=mut;sx.setLineDash([3,4]);sx.beginPath();sx.moveTo(ax,10);sx.lineTo(ax,224);sx.stroke();sx.setLineDash([]);
 kdraw(C,cols[cur]);
 if(cur!==lastCur){lastCur=cur;const c=cols[cur],ar=(cols.arps||[]).find(a=>cur>=a.a&&cur<=a.b);
  $('info').innerHTML=c?'<b>'+(c.name||(ar?ar.name+' (arpeggio)':'Single notes'))+'</b><br>'+c.gs.map(g=>(g.h?'Right hand ':'Left hand ')+g.ns.map(n=>(n.f??'-')+' on '+nm(n.n)).join(', ')).join('<br>'):'Open a MIDI file to see chords and fingering.'}}
function kdraw(C,c){
 const lh=C('--lh'),rh=C('--rh'),ok=C('--ok'),kw=C('--kw'),kk=C('--kb'),line=C('--line');
 kx.clearRect(0,0,KW,110);kr=[];const wh=[];for(let n=lo;n<=hi;n++)if(!BLK.includes(n%12))wh.push(n);
 const w=KW/wh.length,bw=w*.62,tg={};if(c)c.gs.forEach(g=>g.ns.forEach(n=>tg[n.n]=n));
 const col=n=>held.has(n)?ok:tg[n]?(tg[n].h?rh:lh):null;
 wh.forEach((n,i)=>{const x=i*w;kr.push({n,x,w,h:110,b:0});kx.fillStyle=col(n)||kw;kx.fillRect(x,0,w-1,110);
  if(tg[n]&&tg[n].f){kx.fillStyle='#fff';kx.font='700 12px system-ui';kx.textAlign='center';kx.fillText(tg[n].f,x+w/2,88);kx.textAlign='left'}
  if(n%12==0){kx.fillStyle=col(n)?'#fff':'#66727e';kx.font='9px system-ui';kx.fillText(nm(n),x+2,106)}});
 for(let n=lo;n<=hi;n++)if(BLK.includes(n%12)){const i=wh.indexOf(n-1);if(i<0)continue;const x=(i+1)*w-bw/2;
  kr.push({n,x,w:bw,h:66,b:1});kx.fillStyle=col(n)||kk;kx.fillRect(x,0,bw,66);
  if(tg[n]&&tg[n].f){kx.fillStyle='#fff';kx.font='700 11px system-ui';kx.textAlign='center';kx.fillText(tg[n].f,x+bw/2,56);kx.textAlign='left'}}}
function hit(e){const r=kb.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let f=null;
 for(const k of kr)if(x>=k.x&&x<k.x+k.w&&y<k.h){if(k.b)return k.n;f=f??k.n}return f}
kb.onpointerdown=e=>{const n=hit(e);if(n==null)return;kb.setPointerCapture(e.pointerId);ptr[e.pointerId]=n;held.add(n);snd(n,1.2)};
kb.onpointerup=kb.onpointercancel=e=>{const n=ptr[e.pointerId];if(n!=null){held.delete(n);delete ptr[e.pointerId]}};
sc.onclick=e=>{if(!cols.length)return;const x=e.clientX-sc.getBoundingClientRect().left;seek(Math.round(fx()+(x-W*.3)/SP))};

/* ---------- playback / wait mode ---------- */
let last=0;
function frame(ts){const dt=Math.min((ts-last)/1000,.1);last=ts;
 if(playing&&cols.length){
  if(!wait){pos+=dt*spd;
   while(nxt<cols.length&&cols[nxt].t<=pos){cols[nxt].gs.forEach(g=>g.ns.forEach(n=>snd(n.n,(n.e-n.s)/spd)));nxt++}
   if(loopOn&&A>=0&&B>=A&&nxt>B+1)seek(A);
   else if(pos>cols[cols.length-1].end+.5)stop()}
  else{const c=cols[wi];
   if(!c)stop();
   else if(pos<c.t)pos=Math.min(c.t,pos+dt*spd);
   else if(c.p.every(p=>held.has(p))){wi++;if(loopOn&&A>=0&&B>=A&&wi>B)seek(A)}
   else pos=c.t}}
 draw();requestAnimationFrame(frame)}
$('pp').onclick=()=>{if(!cols.length)return;ac=ac||new AudioContext();ac.resume();
 if(playing){stop();return}
 if(pos>cols[cols.length-1].end)seek(0);playing=true;nxt=cols.findIndex(c=>c.t>=pos-.001);if(nxt<0)nxt=cols.length;
 wi=Math.max(0,Math.min(cols.length-1,Math.round(fx())));$('pp').textContent='Pause'};
$('rw').onclick=()=>{if(cols.length)seek(0);lastCur=-1};
$('demo').onclick=demo;
$('wait').onclick=e=>{wait=!wait;e.target.textContent='Wait for me: '+(wait?'on':'off');e.target.classList.toggle('on',wait);wi=cur;nxt=cur};
$('spd').onchange=e=>spd=+e.target.value;
$('vw').onclick=e=>{chordView=!chordView;e.target.textContent=chordView?'Chord view':'Note view';e.target.classList.toggle('on',chordView)};

$('sw').onclick=()=>{if(!raw.length)return;swap=!swap;const i=cur;cols=build(raw);lastCur=-1;seek(i)};

(()=>{const $=id=>document.getElementById(id);
if(!('serviceWorker' in navigator)){$('vt').textContent='Updates need a secure (https) page.';$('chk').hidden=true;return}
const ask=(w,m)=>new Promise(r=>{if(!w)return r(null);const c=new MessageChannel();c.port1.onmessage=e=>r(e.data);try{w.postMessage(m,[c.port2])}catch(x){return r(null)}setTimeout(()=>r(null),2000)});
const showVer=v=>{if(v){$('vh').textContent='v'+v;$('vt').textContent='Version '+v}};
const banner=w=>ask(w,'GET_VERSION').then(v=>{
 $('upt').textContent=v?'Version '+v+' is ready to install.':'A new version is ready to install.';
 const b=$('upd'),go=$('upgo');b.hidden=false;go.disabled=false;go.textContent='Update now';
 go.onclick=()=>{go.disabled=true;go.textContent='Updating…';w.postMessage('SKIP_WAITING')};
 $('uplater').onclick=()=>{b.hidden=true}});
const hadCtl=!!navigator.serviceWorker.controller;
addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(reg=>{
 navigator.serviceWorker.ready.then(r=>ask(r.active,'GET_VERSION')).then(showVer);
 if(reg.waiting&&navigator.serviceWorker.controller)banner(reg.waiting);
 reg.addEventListener('updatefound',()=>{const n=reg.installing;if(!n)return;
  n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)banner(n)})});
 const check=manual=>{if(manual)$('upmsg').textContent='Checking…';
  return reg.update().then(()=>{if(!manual)return;
   setTimeout(()=>{$('upmsg').textContent=(reg.installing||reg.waiting)?'Update found.':'You’re up to date.'},800)})
  .catch(()=>{if(manual)$('upmsg').textContent='Couldn’t check. Are you online?'})};
 $('chk').onclick=()=>check(true);
 check(false);setInterval(()=>check(false),30*60*1000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)check(false)})
}).catch(()=>{$('vt').textContent='Offline mode unavailable.'}));
let rl=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl||rl)return;rl=1;location.reload()})
})();
</script>
